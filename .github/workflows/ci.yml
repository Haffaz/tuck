name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS 27 with Xcode 27 on Apple silicon. The Swift helpers need the macOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          node --version

      - run: node scripts/version.mjs --check

      - run: npm ci

      - run: npx playwright install chromium

      # Frontend build, clippy, Rust tests, Swift checks and Playwright UI tests.
      # Tests that call Apple Intelligence are opt-in and do not run here.
      - run: npm run check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
