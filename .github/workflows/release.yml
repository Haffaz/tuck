name: Release

# Push a tag such as v0.2.0 to test, build and create a draft GitHub release.
# Review the draft and publish it on GitHub. Run manually to build the same
# files as workflow artifacts without creating a release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # macOS 27 with Xcode 27 on Apple silicon. The Swift helpers need the macOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check version
        run: node scripts/version.mjs --check "$TAG"

      - name: Read release notes
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat .github/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run check

      # Ad-hoc signed (bundle.macOS.signingIdentity "-"), not notarized. Without a
      # tag, the action only builds and uploads workflow artifacts.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          tagName: ${{ env.TAG }}
          releaseName: Tuck __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true

      - name: Add checksums
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir checksums
          gh release download "$TAG" --dir checksums
          cd checksums
          shasum -a 256 -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
