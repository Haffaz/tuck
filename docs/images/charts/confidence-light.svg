<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Readable scans score 0.75 to 1.0: Swedish, Arabic and Hindi bank statements, an invoice and a passport page. Tamil scores 0.42 and Sinhala 0.30, below the 0.6 cut-off, so those files wait for the user instead of being guessed." font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Spotting scans Tuck can't read</title><desc>Readable scans score 0.75 to 1.0: Swedish, Arabic and Hindi bank statements, an invoice and a passport page. Tamil scores 0.42 and Sinhala 0.30, below the 0.6 cut-off, so those files wait for the user instead of being guessed.</desc>
<rect x="0.5" y="0.5" width="719" height="319" rx="16" fill="#fffdf9" stroke="#efe3d3"/>
<text x="28" y="40" font-size="16" font-weight="650" fill="#2b2118" text-anchor="start">Spotting scans Tuck can't read</text>
<text x="28" y="62" font-size="12.5" font-weight="400" fill="#7d6a59" text-anchor="start">Text-recognition confidence on synthetic scans. Apple's OCR does not support Sinhala or Tamil.</text>
<rect x="28" y="79" width="10" height="10" rx="2" fill="#0ca30c"/>
<text x="44" y="88" font-size="12" font-weight="400" fill="#7d6a59" text-anchor="start">Read and filed</text>
<rect x="146.39999999999998" y="79" width="10" height="10" rx="2" fill="#fab219"/>
<text x="162.39999999999998" y="88" font-size="12" font-weight="400" fill="#7d6a59" text-anchor="start">Waits for you</text>
<line x1="200.0" y1="98" x2="200.0" y2="282" stroke="#f1e8dc" stroke-width="1"/>
<text x="200.0" y="298" font-size="11" font-weight="400" fill="#9a8a7a" text-anchor="middle">0.0</text>
<line x1="288.0" y1="98" x2="288.0" y2="282" stroke="#f1e8dc" stroke-width="1"/>
<text x="288.0" y="298" font-size="11" font-weight="400" fill="#9a8a7a" text-anchor="middle">0.2</text>
<line x1="376.0" y1="98" x2="376.0" y2="282" stroke="#f1e8dc" stroke-width="1"/>
<text x="376.0" y="298" font-size="11" font-weight="400" fill="#9a8a7a" text-anchor="middle">0.4</text>
<line x1="464.0" y1="98" x2="464.0" y2="282" stroke="#f1e8dc" stroke-width="1"/>
<text x="464.0" y="298" font-size="11" font-weight="400" fill="#9a8a7a" text-anchor="middle">0.6</text>
<line x1="552.0" y1="98" x2="552.0" y2="282" stroke="#f1e8dc" stroke-width="1"/>
<text x="552.0" y="298" font-size="11" font-weight="400" fill="#9a8a7a" text-anchor="middle">0.8</text>
<line x1="640.0" y1="98" x2="640.0" y2="282" stroke="#f1e8dc" stroke-width="1"/>
<text x="640.0" y="298" font-size="11" font-weight="400" fill="#9a8a7a" text-anchor="middle">1.0</text>
<line x1="200" y1="98" x2="200" y2="282" stroke="#d9cbb8" stroke-width="1"/>
<line x1="464.0" y1="98" x2="464.0" y2="282" stroke="#7d6a59" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="458.0" y="92" font-size="11.5" font-weight="600" fill="#7d6a59" text-anchor="end">cut-off 0.6</text>
<line x1="200" y1="112" x2="640" y2="112" stroke="#f1e8dc" stroke-width="1"/>
<text x="186" y="116" font-size="12.5" font-weight="400" fill="#2b2118" text-anchor="end">Swedish bank statement</text>
