<circle cx="384.79999999999995" cy="242" r="6" fill="#fab219" stroke="#fffdf9" stroke-width="2"/>
<text x="396.79999999999995" y="246" font-size="12" font-weight="600" fill="#2b2118" text-anchor="start">0.42</text>
<line x1="200" y1="268" x2="640" y2="268" stroke="#f1e8dc" stroke-width="1"/>
