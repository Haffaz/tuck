[package]
name = "tuck-rules-nesting-eval"
version = "0.0.0"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
wait-timeout = "0.2"
# Production tauri::Url is a re-export of this same URL type.
tauri = { package = "url", version = "2" }
